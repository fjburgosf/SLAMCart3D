experiment:
  name: maze_autonomous_exploration
  seed: 42
  robot:
    initial_x_m: 5.0
    initial_y_m: 4.0
    initial_yaw_rad: 0.0
  simulation:
    world: indoor_maze
    motion_profile: frontier
    duration_s: 60.0
    timestep_s: 0.1
    linear_velocity_m_s: 0.4
    stop_at_walls: true
  slam:
    algorithm: adaptive_hybrid
  lidar:
    beam_count: 60
    field_of_view_deg: 270.0
    max_range_m: 12.0
  lidar3d:
    enabled: true
    azimuth_beams: 36
    elevation_beams: 5
    vertical_fov_deg: 40.0
  occupancy_grid:
    enabled: true
    resolution_m: 0.25
    beam_stride: 1
