experiment:
  name: example_indoor_complex
  seed: 42
  simulation:
    duration_s: 8.0
    timestep_s: 0.1
    world: indoor_complex
    linear_velocity_m_s: 0.35
    yaw_rate_rad_s: 0.0
  lidar:
    beam_count: 60
    field_of_view_deg: 270.0
    max_range_m: 15.0
  degradation:
    lidar_noise_std_m: 0.02
    wheel_rate_noise_std_rad_s: 0.01
  slam:
    algorithm: icp_odometry
