experiment:
  name: example_camera_rgbd
  seed: 42
  lidar:
    beam_count: 24
  camera:
    enabled: true
    width_px: 64
    height_px: 48
    horizontal_fov_deg: 90.0
    vertical_fov_deg: 60.0
    sensor_height_m: 0.5
    max_range_m: 12.0
  degradation:
    camera_rgb_noise_std: 4.0
    camera_depth_noise_std_m: 0.02
    camera_blur_radius_px: 1
    camera_lighting_factor: 0.8
    camera_texture_reduction_fraction: 0.15
    camera_occlusion_fraction: 0.1
    camera_frame_dropout_probability: 0.1
  simulation:
    duration_s: 1.0
    timestep_s: 0.1
    world: indoor_simple
  slam:
    algorithm: dead_reckoning
