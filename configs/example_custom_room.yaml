experiment:
  name: example_custom_room
  seed: 42
  robot:
    initial_x_m: 5.0
    initial_y_m: 4.0
    initial_yaw_rad: 0.0
  lidar:
    beam_count: 24
  lidar3d:
    enabled: true
    azimuth_beams: 36
    elevation_beams: 5
  simulation:
    duration_s: 4.0
    timestep_s: 0.1
    world: custom
    world_segments:
      - {x1: 0.0, y1: 0.0, x2: 10.0, y2: 0.0, height_m: 2.5}
      - {x1: 10.0, y1: 0.0, x2: 10.0, y2: 10.0, height_m: 2.5}
      - {x1: 10.0, y1: 10.0, x2: 0.0, y2: 10.0, height_m: 2.5}
      - {x1: 0.0, y1: 10.0, x2: 0.0, y2: 0.0, height_m: 2.5}
      - {x1: 2.0, y1: 2.0, x2: 4.0, y2: 2.0, height_m: 1.8}
      - {x1: 7.0, y1: 1.0, x2: 7.0, y2: 3.0, height_m: 2.2}
  slam:
    algorithm: dead_reckoning
