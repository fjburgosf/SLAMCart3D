[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slamcart3d"
version = "1.0.0"
description = "Reproducible framework for SLAM robustness simulation and adaptive frontier estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Francisco Javier Burgos Flórez", email = "fjburgosf@gmail.com"},
  {name = "Juan Guillermo Popayán Hernández"},
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/fjburgosf/SLAMCart3D"

[project.optional-dependencies]
visualization = ["matplotlib>=3.8"]
gui = ["PySide6-Essentials>=6.7"]
test = ["pytest>=8.0", "matplotlib>=3.8"]
dev = ["ruff>=0.9"]
build = ["pyinstaller>=6.16"]

[project.scripts]
slamcart3d = "slamcart3d.cli:main"
slamcart3d-gui = "slamcart3d.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.tmp/pytest -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
